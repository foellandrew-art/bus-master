<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Bus Master: Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .locked { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
        .unit-card { background: white; border-radius: 1.5rem; transition: all 0.3s ease; border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        .active-unit { border: 3px solid #f59e0b; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .sim-option { cursor: pointer; display: block; padding: 1.1rem; border-radius: 0.75rem; background: #334155; margin-top: 0.6rem; border: 2px solid transparent; text-align: left; width: 100%; color: white; transition: 0.2s; }
        .sim-option:hover { background: #475569; border-color: #64748b; }
        .sim-option.correct { background: #059669 !important; border-color: #34d399 !important; }
        .sim-option.wrong { background: #dc2626 !important; border-color: #f87171 !important; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
        .progress-dot.complete { background: #059669; }
        .progress-dot.current { background: #f59e0b; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="container mx-auto max-w-4xl">
    <header class="bg-slate-900 rounded-3xl p-6 text-white mb-8 shadow-xl border-b-4 border-yellow-500">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black italic uppercase">Bus Master Renewal</h1>
                <p id="user-display" class="text-slate-400 text-xs tracking-widest uppercase">Syncing to Cloud...</p>
            </div>
            <div id="overall-progress" class="flex gap-2 bg-slate-800 p-3 rounded-full"></div>
        </div>
    </header>

    <main id="main-content">
        <div class="flex flex-col items-center justify-center p-20 text-slate-400">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500 mb-4"></div>
            <p>Connecting to your personal database...</p>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    // --- YOUR PERSONAL CLOUD CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAln7AfmSDkFabBJj07_3YAtb-Ci-umA5c",
        authDomain: "bus-master-a876b.firebaseapp.com",
        projectId: "bus-master-a876b",
        storageBucket: "bus-master-a876b.firebasestorage.app",
        messagingSenderId: "269697206448",
        appId: "1:269697206448:web:cce336f7bdb3e2805f5375",
        measurementId: "G-27P10172R5"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'bus-master-app';

    let userProgress = { currentUnit: 0, masteredUnits: [] };

    // --- UNITS ---
    const unitData = [
        { id: 0, title: "Unit 1: Mirror & Danger Zone", summary: "The 10ft Danger Zone is critical. Mirrors must be adjusted to see students walking 10ft in front." },
        { id: 1, title: "Unit 2: Pre-Trip & Air Brakes", summary: "Check for 60 PSI warning and 4/32 steer tire tread. You are legally responsible for air worthiness." },
        { id: 2, title: "Unit 3: 8-Light & Loading", summary: "Ambers at 100/300ft. Reds and stop arm only when door opens. Never for RR crossings." },
        { id: 3, title: "Unit 4: Railroad Crossings", summary: "Stop 15-50ft. Silence fans. Open door and window. Look and Listen." }
    ];

    // --- CLOUD BRAIN ---
    async function startApp() {
        try {
            await signInAnonymously(auth);
        } catch (e) {
            console.error("Cloud Error", e);
            renderDashboard(); // Fallback if cloud fails
        }
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('user-display').innerText = `Sync: ON (ID: ${user.uid.substring(0,5)})`;
            // This path saves to: artifacts/bus-master/users/USER_ID/data
            const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'data');
            onSnapshot(userDoc, (docSnap) => {
                if (docSnap.exists()) {
                    userProgress = docSnap.data().progress || userProgress;
                }
                renderDashboard();
            }, (err) => {
                console.error("Database error", err);
                renderDashboard();
            });
        }
    });

    async function saveProgress() {
        if (auth.currentUser) {
            const userDoc = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'data');
            await setDoc(userDoc, { progress: userProgress }, { merge: true });
        }
    }

    // --- UI TOOLS ---
    function renderDashboard() {
        renderProgressDots();
        const main = document.getElementById('main-content');
        let html = `<div class="fade-in">`;
        unitData.forEach((u, i) => {
            const isLocked = i > userProgress.currentUnit;
            const isMastered = userProgress.masteredUnits.includes(i);
            html += `
                <div class="unit-card p-6 mb-4 ${isLocked ? 'locked' : (i === userProgress.currentUnit ? 'active-unit' : 'border-emerald-100 bg-emerald-50')}">
                    <h3 class="font-bold text-lg mb-4">${u.title}</h3>
                    <button onclick="window.startModule(${i})" class="w-full ${isMastered ? 'bg-emerald-600' : 'bg-slate-800'} text-white py-3 rounded-xl font-bold">
                        ${isMastered ? 'Review' : (isLocked ? 'Locked' : 'Start Unit')}
                    </button>
                </div>`;
        });
        html += `</div>`;
        main.innerHTML = html;
    }

    function renderProgressDots() {
        const dots = document.getElementById('overall-progress');
        dots.innerHTML = unitData.map((_, i) => {
            const status = userProgress.masteredUnits.includes(i) ? 'complete' : (i === userProgress.currentUnit ? 'current' : 'pending');
            return `<div class="progress-dot ${status}"></div>`;
        }).join('');
    }

    window.startModule = (id) => {
        const u = unitData[id];
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="bg-white rounded-3xl p-8 shadow-lg fade-in">
                <h2 class="text-2xl font-black mb-4">${u.title}</h2>
                <p class="text-slate-600 mb-8">${u.summary}</p>
                <button onclick="window.completeUnit(${id})" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold text-lg">FINISH UNIT</button>
                <button onclick="window.renderDashboard()" class="w-full mt-4 text-slate-400 font-bold">CANCEL</button>
            </div>`;
    };

    window.completeUnit = async (id) => {
        if (!userProgress.masteredUnits.includes(id)) {
            userProgress.masteredUnits.push(id);
            if (userProgress.currentUnit === id) userProgress.currentUnit++;
            await saveProgress();
        }
        renderDashboard();
    };

    window.renderDashboard = renderDashboard;

    startApp();
</script>
</body>
</html>
