<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Bus Master: Sync Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .unit-card { background: white; border-radius: 1.5rem; transition: all 0.3s ease; border: 1px solid #e2e8f0; margin-bottom: 1rem; }
        .active-unit { border: 3px solid #f59e0b; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .sim-option { cursor: pointer; display: block; padding: 1.1rem; border-radius: 0.75rem; background: #334155; margin-top: 0.6rem; border: 2px solid transparent; text-align: left; width: 100%; color: white; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
        .progress-dot.complete { background: #059669; }
        .progress-dot.current { background: #f59e0b; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="container mx-auto max-w-4xl">
    <header class="bg-slate-900 rounded-3xl p-6 text-white mb-8 shadow-xl border-b-4 border-yellow-500">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black italic uppercase text-yellow-500">Bus Master</h1>
                <p id="user-display" class="text-slate-400 text-xs tracking-widest uppercase font-bold">Establishing Cloud Link...</p>
            </div>
            <div id="overall-progress" class="flex gap-2 bg-slate-800 p-3 rounded-full"></div>
        </div>
    </header>

    <main id="main-content">
        <div class="flex flex-col items-center justify-center py-20 text-slate-500">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500 mb-4"></div>
            <p>Syncing data across devices...</p>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAln7AfmSDkFabBJj07_3YAtb-Ci-umA5c",
        authDomain: "bus-master-a876b.firebaseapp.com",
        projectId: "bus-master-a876b",
        storageBucket: "bus-master-a876b.firebasestorage.app",
        messagingSenderId: "269697206448",
        appId: "1:269697206448:web:cce336f7bdb3e2805f5375"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'bus-master-app';

    let userProgress = { currentUnit: 0, masteredUnits: [] };
    let hasCloudData = false;

    const unitData = [
        { id: 0, title: "Unit 1: Danger Zones", questions: [{ q: "How far does the Danger Zone extend in front of the bus?", a: ["10ft", "20ft", "30ft", "5ft"], c: 2 }] },
        { id: 1, title: "Unit 2: Air Brakes", questions: [{ q: "When should the low air alarm trigger?", a: ["100 PSI", "60 PSI", "20 PSI"], c: 1 }] },
        { id: 2, title: "Unit 3: RR Crossings", questions: [{ q: "Stop distance from nearest rail?", a: ["5-10ft", "15-50ft", "100ft"], c: 1 }] },
        { id: 3, title: "Unit 4: 8-Light Law", questions: [{ q: "Amber light distance in 45mph zone?", a: ["100ft", "200ft", "300ft"], c: 2 }] },
        { id: 4, title: "Unit 5: Inspections", questions: [{ q: "Check for sleeping children is required:", a: ["Monthly", "Weekly", "After every route"], c: 2 }] },
        { id: 5, title: "Unit 6: Medical/Legal", questions: [{ q: "MN Medical Exam frequency?", a: ["1 Year", "2 Years", "4 Years"], c: 1 }] }
    ];

    // Fallback timer: Show whatever we have (local or default) if cloud is slow
    const fallbackTimer = setTimeout(() => {
        if (!hasCloudData) {
            const local = localStorage.getItem('bus_master_local');
            if (local) userProgress = JSON.parse(local);
            document.getElementById('user-display').innerText = "Mode: Local (Cloud Search Active)";
            renderDashboard();
        }
    }, 4000);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data');
            
            // Listen to cloud
            onSnapshot(userDocRef, (snap) => {
                if (snap.exists()) {
                    userProgress = snap.data().progress;
                    hasCloudData = true;
                    clearTimeout(fallbackTimer);
                    document.getElementById('user-display').innerText = `Cloud Sync: ON (${user.uid.substring(0,4)})`;
                    renderDashboard();
                } else {
                    // Create first save if new user
                    setDoc(userDocRef, { progress: userProgress });
                    renderDashboard();
                }
            }, (err) => {
                console.error("Rules likely blocking access:", err);
                renderDashboard();
            });
        }
    });

    function renderDashboard() {
        const main = document.getElementById('main-content');
        if (!main) return;
        
        document.getElementById('overall-progress').innerHTML = unitData.map((_, i) => {
            const status = userProgress.masteredUnits.includes(i) ? 'complete' : (i === userProgress.currentUnit ? 'current' : 'pending');
            return `<div class="progress-dot ${status}"></div>`;
        }).join('');

        let html = `<div class="space-y-4">`;
        unitData.forEach((u, i) => {
            const isLocked = i > userProgress.currentUnit;
            const isMastered = userProgress.masteredUnits.includes(i);
            html += `
                <div class="unit-card p-6 ${isLocked ? 'opacity-50' : (i === userProgress.currentUnit ? 'active-unit' : 'bg-white')}">
                    <h3 class="font-bold text-lg">${u.title}</h3>
                    <button onclick="window.startModule(${i})" class="w-full mt-4 ${isMastered ? 'bg-emerald-600' : (isLocked ? 'bg-slate-300' : 'bg-slate-800')} text-white py-3 rounded-xl font-bold">
                        ${isMastered ? 'Review' : (isLocked ? 'Locked' : 'Start')}
                    </button>
                </div>`;
        });
        main.innerHTML = html + `</div>`;
    }

    window.startModule = (unitId) => {
        if (unitId > userProgress.currentUnit) return;
        const q = unitData[unitId].questions[0];
        document.getElementById('main-content').innerHTML = `
            <div class="bg-white rounded-3xl p-8 shadow-lg">
                <h2 class="text-xl font-bold mb-6">${q.q}</h2>
                ${q.a.map((opt, idx) => `<button onclick="window.check(${unitId}, ${idx}, ${q.c})" class="sim-option">${opt}</button>`).join('')}
                <button onclick="renderDashboard()" class="w-full mt-8 text-slate-400 text-sm font-bold">Back</button>
            </div>`;
    };

    window.check = async (unitId, selected, correct) => {
        if (selected === correct) {
            if (!userProgress.masteredUnits.includes(unitId)) {
                userProgress.masteredUnits.push(unitId);
                if (userProgress.currentUnit === unitId) userProgress.currentUnit++;
                save();
            }
            renderDashboard();
        } else {
            alert("Incorrect. Review your manual!");
        }
    };

    function save() {
        localStorage.setItem('bus_master_local', JSON.stringify(userProgress));
        if (auth.currentUser) {
            const userDocRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'data');
            setDoc(userDocRef, { progress: userProgress }, { merge: true });
        }
    }

    signInAnonymously(auth);
</script>
</body>
</html>
